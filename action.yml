name: 'SkaleData Deploy'
description: 'Build/push image (if relevant files changed) and always sync DAGs to a SkaleData cluster'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  api-key:
    description: 'SkaleData API key (sdk_...)'
    required: true
  cluster-id:
    description: 'Cluster public ID (from SkaleData console)'
    required: true
  app-type:
    description: 'Application type (airflow, airbyte, docs, slackbot, superset, datahub)'
    required: true
    default: 'airflow'
  image-tag:
    description: 'Docker image tag (defaults to git SHA)'
    required: false
    default: ${{ github.sha }}
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: './Dockerfile'
  context:
    description: 'Docker build context directory'
    required: false
    default: '.'
  build-args:
    description: 'Docker build arguments (one per line, KEY=VALUE format)'
    required: false
    default: ''
  api-url:
    description: 'SkaleData API URL (override for dev/staging)'
    required: false
    default: 'https://api.skaledata.com'
  skip-build:
    description: 'Skip docker build/push and deploy-image, even when image-rebuild paths match (DAGs still upload)'
    required: false
    default: 'false'
  image-rebuild-paths:
    description: |
      Newline-separated glob patterns. If any file changed in the push matches one of these
      patterns, an image rebuild + deploy-image is triggered. DAGs are uploaded regardless.
      When change detection isn't possible (workflow_dispatch, first push to branch, shallow
      clone with no parent), the action defaults to rebuilding the image — safe fallback.
    required: false
    default: |
      Dockerfile
      requirements.txt
      requirements/**
      pyproject.toml
      setup.py
      setup.cfg
      packages/**
      plugins/**
  dags-path:
    description: 'Path to DAGs folder, packaged as tar.gz and uploaded to blob storage on every run.'
    required: false
    default: 'dags'
  skip-dag-upload:
    description: 'Skip the DAG sync upload. Use if you manage DAGs out-of-band (rare).'
    required: false
    default: 'false'
  respect-gitignore:
    description: |
      When true (default), only files git would consider "tracked or untracked-but-not-ignored"
      are synced. Honors nested .gitignore files exactly like git itself. Set to 'false' to
      ship everything under dags-path regardless of .gitignore.
    required: false
    default: 'true'
  extra-excludes:
    description: |
      Newline-separated list of file/dir names to exclude in addition to .gitignore. Matched
      against the basename anywhere in the tree (`find -name`). Trailing slash means
      "directory of that name". Example:
        target/
        build/
        secrets.json
    required: false
    default: ''
  extra-includes:
    description: |
      Newline-separated list of path globs (relative to dags-path) to re-add even if
      .gitignore would skip them. Useful when CI generates files into a gitignored dir
      that you actually want shipped. Example:
        dbt_packages/manifest.json
        target/index.html
    required: false
    default: ''
  verbose-sync:
    description: |
      When false (default), the underlying cloud sync tool runs with errors-only
      verbosity — a clean run prints one summary notice. Set to 'true' to surface
      the full per-file upload/delete output (still wrapped in a collapsible
      ::group:: in the GitHub Actions log).
    required: false
    default: 'false'

outputs:
  image:
    description: 'Full image URI that was deployed (empty if image was not rebuilt)'
    value: ${{ steps.deploy.outputs.image }}
  status:
    description: 'deploy-image status (deployed, upgrading, or skipped)'
    value: ${{ steps.deploy.outputs.status }}
  image-rebuilt:
    description: 'true if an image build + deploy-image ran this invocation, false otherwise'
    value: ${{ steps.detect.outputs.image-rebuild }}
  dag-files-uploaded:
    description: 'Number of DAG files uploaded to blob storage (0 if skipped)'
    value: ${{ steps.upload-dags.outputs.files-uploaded }}
  dag-sync-url:
    description: 'Blob storage URL DAGs synced to (empty if skipped)'
    value: ${{ steps.upload-dags.outputs.sync-url }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [[ -z "${{ inputs.api-key }}" ]]; then
          echo "::error::api-key is required"
          exit 1
        fi
        if [[ ! "${{ inputs.api-key }}" =~ ^sdk_ ]]; then
          echo "::error::api-key must start with 'sdk_' (create one at Organization > API Keys)"
          exit 1
        fi
        if [[ -z "${{ inputs.cluster-id }}" ]]; then
          echo "::error::cluster-id is required"
          exit 1
        fi

    - name: Detect changed files
      id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        AFTER_SHA: ${{ github.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        REBUILD_PATTERNS: ${{ inputs.image-rebuild-paths }}
      run: |
        set -u

        # Resolve the diff base depending on event type.
        BASE=""
        case "$EVENT_NAME" in
          pull_request|pull_request_target)
            BASE="$PR_BASE_SHA"
            ;;
          push)
            # github.event.before is all-zeros for the first push to a branch.
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE_SHA"
            fi
            ;;
        esac

        if [ -z "$BASE" ]; then
          echo "::notice::No diff base available (event=$EVENT_NAME) — defaulting to image rebuild"
          echo "image-rebuild=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Ensure the base commit is fetched (default checkout depth may be 1).
        if ! git cat-file -e "$BASE" 2>/dev/null; then
          git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
        fi
        if ! git cat-file -e "$BASE" 2>/dev/null; then
          echo "::notice::Cannot resolve base SHA $BASE in local clone — defaulting to image rebuild"
          echo "image-rebuild=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        CHANGED=$(git diff --name-only "$BASE" "$AFTER_SHA" || true)
        if [ -z "$CHANGED" ]; then
          echo "No changed files between $BASE and $AFTER_SHA — skipping image rebuild"
          echo "image-rebuild=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Match changed files against rebuild glob patterns. Use Python's fnmatch
        # because bash globstar handling of ** in extglob is inconsistent across
        # runners and doesn't naturally compose with negation/anchoring.
        REBUILD=$(CHANGED_FILES="$CHANGED" REBUILD_PATTERNS="$REBUILD_PATTERNS" python3 -c "
        import os, sys
        from fnmatch import fnmatch
        changed = [l.strip() for l in os.environ.get('CHANGED_FILES', '').splitlines() if l.strip()]
        patterns = [p.strip() for p in os.environ.get('REBUILD_PATTERNS', '').splitlines() if p.strip() and not p.strip().startswith('#')]
        def matches(path, pattern):
            if '**' in pattern:
                # Anchor on the prefix before '**' to match any file under that subtree.
                prefix = pattern.split('**', 1)[0].rstrip('/')
                return prefix == '' or path == prefix or path.startswith(prefix + '/')
            return fnmatch(path, pattern)
        for f in changed:
            for p in patterns:
                if matches(f, p):
                    sys.stderr.write(f'match: {f} ~ {p}\n')
                    print('true'); sys.exit(0)
        print('false')
        ")

        if [ "$REBUILD" = "true" ]; then
          echo "::notice::Detected changes to image-rebuild paths — building image"
          echo "image-rebuild=true" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::Only DAG / non-image files changed — skipping image rebuild"
          echo "image-rebuild=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Get registry credentials
      id: auth
      if: steps.detect.outputs.image-rebuild == 'true' && inputs.skip-build != 'true'
      shell: bash
      run: |
        CREDS=$(curl -sf -X POST \
          "${{ inputs.api-url }}/clusters/${{ inputs.cluster-id }}/registry-token" \
          -H "Authorization: Bearer ${{ inputs.api-key }}")

        if [ $? -ne 0 ] || [ -z "$CREDS" ]; then
          echo "::error::Failed to get registry credentials from SkaleData API"
          exit 1
        fi

        echo "registry=$(echo "$CREDS" | jq -r .registry)" >> "$GITHUB_OUTPUT"
        echo "ar_url=$(echo "$CREDS" | jq -r .artifact_registry_url)" >> "$GITHUB_OUTPUT"
        echo "username=$(echo "$CREDS" | jq -r .username)" >> "$GITHUB_OUTPUT"

        # Mask the token so it never appears in logs
        TOKEN=$(echo "$CREDS" | jq -r .token)
        echo "::add-mask::$TOKEN"
        echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

    - name: Docker login
      if: steps.detect.outputs.image-rebuild == 'true' && inputs.skip-build != 'true'
      shell: bash
      run: |
        echo "${{ steps.auth.outputs.token }}" | \
          docker login "${{ steps.auth.outputs.registry }}" \
            -u "${{ steps.auth.outputs.username }}" \
            --password-stdin

    - name: Build and push image
      if: steps.detect.outputs.image-rebuild == 'true' && inputs.skip-build != 'true'
      shell: bash
      run: |
        IMAGE="${{ steps.auth.outputs.ar_url }}/${{ inputs.app-type }}:${{ inputs.image-tag }}"

        BUILD_ARGS=""
        if [ -n "${{ inputs.build-args }}" ]; then
          while IFS= read -r arg; do
            [ -n "$arg" ] && BUILD_ARGS="$BUILD_ARGS --build-arg $arg"
          done <<< "${{ inputs.build-args }}"
        fi

        LATEST="${{ steps.auth.outputs.ar_url }}/${{ inputs.app-type }}:latest"
        # SkaleData's helm chart pins defaultAirflowTag to "current" with
        # imagePullPolicy: Always, so the rolling restart that deploy-image
        # triggers will only pick up new code if :current actually moved.
        CURRENT="${{ steps.auth.outputs.ar_url }}/${{ inputs.app-type }}:current"

        docker build \
          -f "${{ inputs.dockerfile }}" \
          -t "$IMAGE" \
          -t "$LATEST" \
          -t "$CURRENT" \
          $BUILD_ARGS \
          "${{ inputs.context }}"

        docker push "$IMAGE"
        docker push "$LATEST"
        docker push "$CURRENT"
        echo "Built and pushed: $IMAGE (also tagged :latest and :current)"

    - name: Trigger deploy
      id: deploy
      if: steps.detect.outputs.image-rebuild == 'true' && inputs.skip-build != 'true'
      shell: bash
      run: |
        for ATTEMPT in 1 2 3; do
          RESPONSE=$(curl -sw '\n%{http_code}' -X POST \
            "${{ inputs.api-url }}/clusters/${{ inputs.cluster-id }}/deploy-image" \
            -H "Authorization: Bearer ${{ inputs.api-key }}" \
            -H "Content-Type: application/json" \
            -d '{"app_type": "${{ inputs.app-type }}", "image_tag": "${{ inputs.image-tag }}"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            break
          elif [ "$HTTP_CODE" = "409" ] && [ "$ATTEMPT" -lt 3 ]; then
            DETAIL=$(echo "$BODY" | jq -r '.detail // "Cluster busy"' 2>/dev/null || echo "Cluster busy")
            echo "::warning::$DETAIL — retrying in 30s (attempt $ATTEMPT/3)"
            sleep 30
          else
            DETAIL=$(echo "$BODY" | jq -r '.detail // "Unknown error"' 2>/dev/null || echo "HTTP $HTTP_CODE")
            echo "::error::Deploy failed: $DETAIL (HTTP $HTTP_CODE)"
            exit 1
          fi
        done

        STATUS=$(echo "$BODY" | jq -r .status)
        IMAGE=$(echo "$BODY" | jq -r .image)

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

        if [ "$STATUS" = "upgrading" ]; then
          echo "::notice::First custom image deploy — Terraform upgrade in progress (~3-5 min)"
        else
          echo "::notice::Rolling restart triggered — pods updating now"
        fi

    - name: Mark deploy skipped
      id: deploy-skip
      if: steps.detect.outputs.image-rebuild != 'true' || inputs.skip-build == 'true'
      shell: bash
      run: |
        echo "::notice::Image rebuild skipped (image-rebuild=${{ steps.detect.outputs.image-rebuild }}, skip-build=${{ inputs.skip-build }})"

    - name: Sync DAGs
      id: upload-dags
      if: inputs.skip-dag-upload != 'true'
      shell: bash
      env:
        RESPECT_GITIGNORE: ${{ inputs.respect-gitignore }}
        EXTRA_EXCLUDES: ${{ inputs.extra-excludes }}
        EXTRA_INCLUDES: ${{ inputs.extra-includes }}
        VERBOSE_SYNC: ${{ inputs.verbose-sync }}
      run: |
        set -euo pipefail
        DAGS_PATH="${{ inputs.dags-path }}"
        if [ ! -d "$DAGS_PATH" ]; then
          echo "::notice::dags-path '$DAGS_PATH' does not exist — skipping DAG sync"
          echo "files-uploaded=0" >> "$GITHUB_OUTPUT"
          echo "sync-url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # 1. Build the source set. We pre-stage into a tmp dir when any
        #    filtering is requested — one consistent code path that works for
        #    aws/gcs/azure (each CLI's --exclude dialect is different and
        #    none of them understand nested .gitignore files).
        SRC="$DAGS_PATH"
        IN_GIT_REPO=false
        git -C "$DAGS_PATH" rev-parse --git-dir >/dev/null 2>&1 && IN_GIT_REPO=true

        NEED_STAGE=false
        [ "$RESPECT_GITIGNORE" = "true" ] && $IN_GIT_REPO && NEED_STAGE=true
        [ -n "${EXTRA_INCLUDES// /}" ] && NEED_STAGE=true
        [ -n "${EXTRA_EXCLUDES// /}" ] && NEED_STAGE=true

        if $NEED_STAGE; then
          STAGE="$(mktemp -d)/sync"
          mkdir -p "$STAGE"
          if [ "$RESPECT_GITIGNORE" = "true" ] && $IN_GIT_REPO; then
            # Tracked + untracked-but-not-ignored. Honors nested .gitignore.
            git -C "$DAGS_PATH" ls-files --cached --others --exclude-standard -z \
              | rsync --files-from=- --from0 -a "$DAGS_PATH/" "$STAGE/"
            echo "::notice::Pre-staged source via .gitignore filter"
          else
            rsync -a "$DAGS_PATH/" "$STAGE/"
          fi

          # extra-includes: copy any matching paths back into the stage
          if [ -n "${EXTRA_INCLUDES// /}" ]; then
            while IFS= read -r pat; do
              [ -z "$pat" ] && continue
              (cd "$DAGS_PATH" && find . -path "./$pat" -type f -print0 2>/dev/null) | \
                while IFS= read -r -d '' f; do
                  rel="${f#./}"
                  mkdir -p "$STAGE/$(dirname "$rel")"
                  cp "$DAGS_PATH/$rel" "$STAGE/$rel"
                done
            done <<< "$EXTRA_INCLUDES"
          fi

          # extra-excludes: prune from the stage. Trailing-slash means
          # "directory of that name."
          if [ -n "${EXTRA_EXCLUDES// /}" ]; then
            while IFS= read -r pat; do
              [ -z "$pat" ] && continue
              if [[ "$pat" == */ ]]; then
                find "$STAGE" -type d -name "${pat%/}" -exec rm -rf {} + 2>/dev/null || true
              else
                find "$STAGE" -name "$pat" -delete 2>/dev/null || true
              fi
            done <<< "$EXTRA_EXCLUDES"
          fi

          # Baseline cleanup: macOS resource forks, DS_Store, pyc/pycache.
          find "$STAGE" -name '._*' -delete 2>/dev/null || true
          find "$STAGE" -name '.DS_Store' -delete 2>/dev/null || true
          find "$STAGE" -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          find "$STAGE" -name '*.pyc' -delete 2>/dev/null || true

          SRC="$STAGE"
        fi

        STAGED_COUNT=$(find "$SRC" -type f 2>/dev/null | wc -l | tr -d ' ')
        echo "::notice::Source set: $STAGED_COUNT files ready to sync"

        # 3. Ask the control plane for short-lived, prefix-scoped credentials.
        #    Bytes never leave this runner via SkaleData — we upload straight
        #    to the customer's S3/GCS/Blob.
        CREDS=$(curl -sS -w '\n%{http_code}' -X POST \
          "${{ inputs.api-url }}/clusters/${{ inputs.cluster-id }}/dag-sync-credentials" \
          -H "Authorization: Bearer ${{ inputs.api-key }}" \
          -H "Content-Type: application/json" \
          -d "{\"app_type\":\"${{ inputs.app-type }}\"}")
        CREDS_CODE=$(echo "$CREDS" | tail -1)
        CREDS_BODY=$(echo "$CREDS" | sed '$d')
        if [ "$CREDS_CODE" != "200" ]; then
          DETAIL=$(echo "$CREDS_BODY" | jq -r '.detail // "Unknown error"' 2>/dev/null || echo "HTTP $CREDS_CODE")
          echo "::error::Failed to mint DAG sync credentials: $DETAIL (HTTP $CREDS_CODE)"
          exit 1
        fi

        PROVIDER=$(echo "$CREDS_BODY" | jq -r .provider)
        BUCKET=$(echo "$CREDS_BODY" | jq -r .bucket)
        PREFIX=$(echo "$CREDS_BODY" | jq -r .prefix)
        REGION=$(echo "$CREDS_BODY" | jq -r '.region // ""')
        SYNC_URL=$(echo "$CREDS_BODY" | jq -r .sync_url)

        # 4. Cloud-native sync from the (possibly staged) source set. Each
        #    tool is incremental — after the first run, subsequent deploys
        #    only upload changed files.
        #
        #    Verbosity: per-file output is suppressed by default (each CLI's
        #    own quiet flag); set verbose-sync=true to see it. Either way
        #    the lines are wrapped in a ::group:: so they're collapsible in
        #    the GH Actions log.
        if [ "$VERBOSE_SYNC" = "true" ]; then
          AWS_QUIET=()
          GCS_QUIET=()
          AZ_QUIET=()
        else
          AWS_QUIET=(--only-show-errors)
          GCS_QUIET=(--verbosity=error)
          AZ_QUIET=(--only-show-errors --no-progress)
        fi

        echo "::group::cloud sync output"
        case "$PROVIDER" in
          aws)
            AWS_ACCESS_KEY_ID=$(echo "$CREDS_BODY" | jq -r .credentials.access_key_id)
            AWS_SECRET_ACCESS_KEY=$(echo "$CREDS_BODY" | jq -r .credentials.secret_access_key)
            AWS_SESSION_TOKEN=$(echo "$CREDS_BODY" | jq -r .credentials.session_token)
            echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
            echo "::add-mask::$AWS_SESSION_TOKEN"
            export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
            export AWS_DEFAULT_REGION="$REGION"
            aws s3 sync "$SRC/" "s3://${BUCKET}/${PREFIX}" \
              --delete \
              --exclude "._*" \
              --exclude ".DS_Store" \
              --exclude "*/__pycache__/*" \
              --exclude "*.pyc" \
              "${AWS_QUIET[@]}"
            ;;
          gcp)
            ACCESS_TOKEN=$(echo "$CREDS_BODY" | jq -r .credentials.access_token)
            echo "::add-mask::$ACCESS_TOKEN"
            TOKEN_FILE="$(mktemp)"
            trap 'rm -f "$TOKEN_FILE"' EXIT
            printf '%s' "$ACCESS_TOKEN" > "$TOKEN_FILE"
            # `gcloud storage rsync` needs SDK >= 449 (Sept 2023). GitHub
            # runners ship a newer version by default.
            gcloud storage rsync "$SRC/" "gs://${BUCKET}/${PREFIX}" \
              --recursive \
              --delete-unmatched-destination-objects \
              --access-token-file="$TOKEN_FILE" \
              --exclude '(^|/)\._.*$' \
              --exclude '(^|/)\.DS_Store$' \
              --exclude '__pycache__' \
              --exclude '\.pyc$' \
              "${GCS_QUIET[@]}"
            ;;
          azure)
            SAS_URL=$(echo "$CREDS_BODY" | jq -r .credentials.sas_url)
            echo "::add-mask::$SAS_URL"
            # `az storage blob upload-batch` parallel-uploads but does NOT
            # delete remote files that were removed locally. `azcopy sync`
            # would; install it if you need delete-on-removal. Cloud-side
            # exclude flags don't exist on Azure's upload-batch, so any
            # filtering must already be reflected in $SRC (pre-stage path).
            BASE_URL="${SAS_URL%%\?*}"
            SAS_QUERY="${SAS_URL#*\?}"
            az storage blob upload-batch \
              --source "$SRC" \
              --destination "${BASE_URL}" \
              --destination-path "${PREFIX%/}" \
              --sas-token "$SAS_QUERY" \
              --overwrite true \
              --pattern '*' \
              "${AZ_QUIET[@]}"
            ;;
          *)
            echo "::error::Unknown cloud provider '$PROVIDER' returned by control plane"
            exit 1
            ;;
        esac
        echo "::endgroup::"

        FILE_COUNT=$(find "$SRC" -type f \
          ! -name '._*' ! -name '.DS_Store' \
          ! -path '*/__pycache__/*' ! -name '*.pyc' \
          | wc -l | tr -d ' ')

        # 5. Tell the control plane the sync happened so it can update
        #    deploy_mode + last_dag_sync_at. Best-effort: a failed callback
        #    leaves the data in place, only the bookkeeping drifts.
        COMPLETE=$(curl -sS -w '\n%{http_code}' -X POST \
          "${{ inputs.api-url }}/clusters/${{ inputs.cluster-id }}/dag-sync-complete" \
          -H "Authorization: Bearer ${{ inputs.api-key }}" \
          -H "Content-Type: application/json" \
          -d "{\"app_type\":\"${{ inputs.app-type }}\",\"files_uploaded\":${FILE_COUNT}}" || true)
        COMPLETE_CODE=$(echo "$COMPLETE" | tail -1)
        if [ "$COMPLETE_CODE" != "200" ]; then
          echo "::warning::DAGs uploaded but control-plane callback returned HTTP $COMPLETE_CODE"
        fi

        echo "files-uploaded=$FILE_COUNT" >> "$GITHUB_OUTPUT"
        echo "sync-url=$SYNC_URL" >> "$GITHUB_OUTPUT"
        echo "::notice::Synced $FILE_COUNT DAG file(s) to $SYNC_URL — pods will sync within 30s"

    - name: Docker logout
      if: always() && steps.auth.outputs.registry != ''
      shell: bash
      run: docker logout "${{ steps.auth.outputs.registry }}" 2>/dev/null || true
